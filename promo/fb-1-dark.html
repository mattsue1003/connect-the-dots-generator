<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Chiron+GoRound+TC:wght@600;800&family=Nunito:wght@900&display=swap"><style>*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#12343B;position:relative}
.cta{display:inline-flex;align-items:center;gap:14px;background:#E8552D;color:#fff;border-radius:999px;padding:20px 40px;font-size:38px;font-weight:900;box-shadow:0 10px 0 #b23d1c, 0 18px 40px rgba(0,0,0,.25)}
.cta .kw{background:#fff;color:#E8552D;border-radius:14px;padding:2px 16px}
.sign{font-size:24px;font-weight:700;letter-spacing:.04em}
.sheet{position:absolute;background:#fff;border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);overflow:hidden}
.sheet svg{display:block;width:100%;height:100%}
body{background:linear-gradient(160deg,#12343B 0%,#0b5560 55%,#028090 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2.5px);background-size:36px 36px}
.wm{position:absolute;right:-40px;top:-90px;font-family:Nunito,sans-serif;font-weight:900;font-size:520px;color:rgba(244,169,60,.10);line-height:1}
.copy{position:absolute;left:70px;top:80px;width:560px;color:#fff}
.eyebrow{display:inline-block;background:#F4A93C;color:#12343B;font-weight:900;font-size:26px;border-radius:999px;padding:6px 22px;margin-bottom:26px}
h1{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:800;font-size:86px;line-height:1.12;letter-spacing:.02em}
h1 em{font-style:normal;color:#F4A93C}
.sub{margin-top:26px;font-size:32px;line-height:1.55;font-weight:500;color:#d6eef0}
.sub b{color:#fff;font-weight:900}
.pills{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}
.pills span{border:2px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 18px;font-size:24px;font-weight:700}
.s1{left:620px;top:150px;width:370px;height:523px;transform:rotate(6deg)}
.s2{left:560px;top:400px;width:330px;height:467px;transform:rotate(-7deg)}
.bottom{position:absolute;left:70px;right:70px;bottom:60px;display:flex;flex-direction:column;gap:26px;color:#fff}
