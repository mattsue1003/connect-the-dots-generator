<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連連看生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: a dotted activity-book desk — sticker library left, A4 worksheet center, settings right; one column on phones. */
:root {
  --bg: #eaf3ff;
  --bg-dot: #c9dcf6;
  --panel: #ffffff;
  --ink: #2a2f4a;
  --muted: #6a7190;
  --line: #dde5f2;
  --pink: #ff6f96;
  --pink-deep: #d94f78;
  --pink-soft: #ffe3ec;
  --sky: #4f8cff;
  --sky-soft: #e1ecff;
  --sun: #ffcf4a;
  --mint: #2fb58a;
  --warn: #c0632a;
  --sheet: #ffffff;
  --sheet-ink: #2a2f4a;
  --shadow: 0 2px 0 rgba(42,47,74,.06), 0 14px 34px -16px rgba(42,47,74,.28);
  --font-display: "Chiron GoRound TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Chiron GoRound TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --radius: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a2e; --bg-dot: #262c48; --panel: #20253d; --ink: #eef0fb; --muted: #a3a9c6; --line: #343a5a;
    --pink: #ff86a7; --pink-deep: #e0628a; --pink-soft: #4a2a3d; --sky: #82aaff; --sky-soft: #283660;
    --sun: #ffd666; --mint: #5fd3a9; --warn: #f2a46c;
    --shadow: 0 2px 0 rgba(0,0,0,.25), 0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a2e; --bg-dot: #262c48; --panel: #20253d; --ink: #eef0fb; --muted: #a3a9c6; --line: #343a5a;
  --pink: #ff86a7; --pink-deep: #e0628a; --pink-soft: #4a2a3d; --sky: #82aaff; --sky-soft: #283660;
  --sun: #ffd666; --mint: #5fd3a9; --warn: #f2a46c;
  --shadow: 0 2px 0 rgba(0,0,0,.25), 0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.7px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 40px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* Header */
header.top {
  max-width: 1440px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px;
  padding-block: 22px 18px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 58px; height: 58px; flex: none; }
.brand h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.1; margin: 0;
  letter-spacing: .02em; text-wrap: balance;
}
.brand h1 .dotword { color: var(--pink); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-size: 13px; color: var(--muted);
}
.badge b { font-family: var(--font-num); color: var(--pink); font-size: 15px; }

/* Grid */
.app {
  max-width: 1440px; margin: 0 auto;
  display: grid; gap: 20px;
  grid-template-columns: 320px minmax(0, 1fr) 290px;
  grid-template-areas: "lib stage ctrl";
  align-items: start;
}
.panel {
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 18px; min-width: 0; box-shadow: var(--shadow);
}
.panel h2 {
  font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.panel h2::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pink);
  box-shadow: 14px 0 0 var(--sun), 28px 0 0 var(--sky); margin-right: 30px;
}
.panel h2 small { margin-left: auto; font-family: var(--font-body); font-weight: 600; color: var(--muted); font-size: 12px; }

/* Library */
.library { grid-area: lib; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  border: 2px solid var(--line); background: transparent; border-radius: 999px;
  padding: 2px 12px; font-size: 13px; color: var(--muted); font-weight: 600;
}
.chip .n { font-family: var(--font-num); font-size: 11px; opacity: .7; margin-left: 3px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
  overflow-y: auto; padding: 4px; margin: -4px; flex: 1;
}
.tile {
  --tint: #ffd0dc;
  display: flex; flex-direction: column; align-items: center; gap: 0;
  background: color-mix(in srgb, var(--tint) 20%, #ffffff);
  border: 2px solid transparent; border-radius: 18px;
  padding: 8px 4px 6px; position: relative; color: #2a2f4a;
  transition: transform .15s ease;
}
.tile svg { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.tile span.nm { font-size: 13px; font-weight: 600; }
.tile .no { position: absolute; top: 5px; left: 8px; font-family: var(--font-num); font-weight: 800; font-size: 10px; color: #9aa2bd; }
.tile:hover { transform: translateY(-2px) rotate(-1deg); }
.tile[aria-pressed="true"] { border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
.lib-foot { margin-top: 14px; display: flex; gap: 8px; }

/* Stage */
.stage { grid-area: stage; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.seg button {
  border: 0; background: transparent; padding: 6px 18px; border-radius: 999px; font-weight: 800; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--pink); color: #fff; }
.meta {
  font-size: 13px; color: var(--muted); background: var(--panel); border: 2px solid var(--line);
  border-radius: 999px; padding: 4px 14px;
}
.meta b { color: var(--ink); font-family: var(--font-num); }
.meta b.nm { font-family: var(--font-display); }
.sheet-wrap { display: flex; justify-content: center; }
#sheet {
  width: 100%; max-width: 660px; background: var(--sheet); border-radius: 8px; box-shadow: var(--shadow);
  aspect-ratio: 210 / 297; overflow: hidden; transform: rotate(-.4deg);
}
#sheet svg { width: 100%; height: 100%; display: block; }
.warn {
  font-size: 13px; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel));
  border: 2px dashed color-mix(in srgb, var(--warn) 40%, transparent);
  border-radius: 14px; padding: 6px 12px; max-width: 660px; margin: 0 auto; width: 100%;
}

/* Play */
#play { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.play-board {
  width: 100%; max-width: 660px; background: var(--sheet); border-radius: 26px; box-shadow: var(--shadow);
  position: relative; aspect-ratio: 1; overflow: hidden; touch-action: manipulation; border: 3px solid var(--line);
}
.play-board svg { width: 100%; height: 100%; display: block; }
.play-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.play-hud { width: 100%; max-width: 660px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.next-pill {
  display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line);
  border-radius: 999px; padding: 3px 6px 3px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.next-pill b {
  font-family: var(--font-num); font-weight: 900; font-size: 20px; color: #fff; background: var(--sky);
  border-radius: 999px; min-width: 40px; padding: 0 10px; text-align: center; line-height: 34px;
}
.progress { flex: 1; min-width: 120px; height: 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); overflow: hidden; }
.progress i {
  display: block; height: 100%; width: 0; transition: width .2s;
  background: repeating-linear-gradient(45deg, var(--mint) 0 8px, color-mix(in srgb, var(--mint) 75%, #fff) 8px 16px);
}
.play-actions { display: flex; gap: 8px; }
.done-card {
  position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
  background: #2a2f4a; color: #fff; border-radius: 999px; padding: 8px 10px 8px 22px;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; white-space: nowrap;
  display: flex; align-items: center; gap: 12px;
  animation: pop .5s cubic-bezier(.2,1.6,.4,1);
}
.done-card button { background: var(--pink); color: #fff; border: 0; border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 800; }
@keyframes pop { from { transform: translateX(-50%) scale(.5); opacity: 0; } }
.hit { cursor: pointer; }
.pulse { animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.8); } }
.reveal { animation: reveal .9s ease forwards; }
@keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
.boop { animation: boop .3s ease; transform-box: fill-box; transform-origin: center; }
@keyframes boop { 50% { transform: scale(1.8); } }

/* Controls */
.controls { grid-area: ctrl; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field > .lbl { font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
.field output { font-family: var(--font-num); font-weight: 900; font-size: 22px; color: var(--pink); }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--pink); }
input[type="text"], select {
  width: 100%; border: 2px solid var(--line); background: var(--sheet); color: var(--sheet-ink);
  border-radius: 14px; padding: 7px 12px;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button {
  border: 2px solid var(--line); background: transparent; border-radius: 12px; padding: 3px 10px; font-size: 13px; font-weight: 600;
}
.pills button[aria-pressed="true"] { background: var(--sky-soft); border-color: var(--sky); color: var(--ink); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--pink); }
.btn {
  border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 7px 14px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 3px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 4px 0 var(--pink-deep); }
.btn.primary:active { box-shadow: 0 0 0 var(--pink-deep); transform: translateY(4px); }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .btn { flex: 1; }
.divider { border: 0; border-top: 2px dotted var(--line); margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; background: var(--sky-soft); border-radius: 12px; padding: 8px 10px; }

@media (max-width: 1180px) {
  .app { grid-template-columns: 300px minmax(0, 1fr); grid-template-areas: "lib stage" "lib ctrl"; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "lib" "stage" "ctrl"; }
  .library { position: static; max-height: none; }
  .grid { grid-template-columns: none; grid-template-rows: repeat(2, auto); grid-auto-flow: column; grid-auto-columns: 92px; overflow-x: auto; overflow-y: hidden; padding-bottom: 8px; }
  .brand h1 { font-size: 26px; }
  .brand svg { width: 48px; height: 48px; }
  #sheet { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; padding: 0; }
  header.top, .library, .controls, .stage-bar, .warn, #play { display: none !important; }
  .app { display: block; max-width: none; }
  #sheet { box-shadow: none; border-radius: 0; max-width: none; width: 210mm; height: 297mm; transform: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 58 58" aria-hidden="true">
      <rect x="2" y="2" width="54" height="54" rx="18" fill="var(--pink)"/>
      <path d="M14 38 L22 17 L31 30 L43 15 L45 40 Z" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="var(--sun)" stroke="#2a2f4a" stroke-width="1.4"><circle cx="14" cy="38" r="3.6"/><circle cx="22" cy="17" r="3.6"/><circle cx="31" cy="30" r="3.6"/><circle cx="43" cy="15" r="3.6"/><circle cx="45" cy="40" r="3.6"/></g>
    </svg>
    <div>
      <h1><span class="dotword">連連看</span>生成器</h1>
      <p>挑一個圖案、調好點數，印成學習單，或直接在線上連連看。</p>
    </div>
  </div>
  <div class="badges"><span class="badge"><b>50</b> 種圖案</span><span class="badge"><b>10–150</b> 個點</span><span class="badge">A4 學習單</span></div>
</header>

<main class="app">
  <aside class="panel library" aria-label="圖案庫">
    <h2>圖案庫 <small id="libCount">50 種</small></h2>
    <div class="chips" id="chips" role="group" aria-label="分類"></div>
    <div class="grid" id="grid"></div>
    <div class="lib-foot">
      <button class="btn small" id="randomBtn" type="button" style="flex:1">隨機挑一個</button>
    </div>
  </aside>

  <section class="stage" aria-label="預覽">
    <div class="stage-bar">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="modeSheet" aria-pressed="true">學習單</button>
        <button type="button" id="modePlay" aria-pressed="false">線上玩</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div id="warn" class="warn" hidden></div>
    <div id="sheetView" class="sheet-wrap"><div id="sheet"></div></div>
    <div id="play" hidden>
      <div class="play-hud">
        <span class="next-pill">下一個 <b id="nextLabel">1</b></span>
        <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
        <div class="play-actions">
          <button class="btn small" type="button" id="hintBtn">提示</button>
          <button class="btn small" type="button" id="undoBtn">復原</button>
          <button class="btn small" type="button" id="restartBtn">重來</button>
        </div>
      </div>
      <div class="play-board" id="board"></div>
    </div>
  </section>

  <aside class="panel controls" aria-label="設定">
    <h2>設定</h2>
    <div class="field">
      <label for="dots">點的數量 <output id="dotsOut">40</output></label>
      <input type="range" id="dots" min="10" max="150" step="1" value="40">
      <div class="pills" id="presets" role="group" aria-label="難度">
        <button type="button" data-n="20">簡單 20</button>
        <button type="button" data-n="40">普通 40</button>
        <button type="button" data-n="70">進階 70</button>
        <button type="button" data-n="110">挑戰 110</button>
      </div>
      <span class="hint">轉角一定會放點，所以有稜有角的圖案，點數下限會高一些。</span>
    </div>

    <div class="field">
      <label for="labelMode">數字怎麼數</label>
      <select id="labelMode">
        <option value="1">1、2、3、4…</option>
        <option value="2">2、4、6、8…（兩個一數）</option>
        <option value="5">5、10、15…（五個一數）</option>
        <option value="10">10、20、30…（十個一數）</option>
        <option value="abc">A、B、C…（英文字母）</option>
      </select>
    </div>

    <div class="field">
      <span class="lbl">方向與起點</span>
      <div class="pills" role="group" aria-label="方向">
        <button type="button" id="dirCw" aria-pressed="true">順時針</button>
        <button type="button" id="dirCcw" aria-pressed="false">逆時針</button>
        <button type="button" id="shuffleStart">換個起點</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl">字與點的大小</span>
      <div class="pills" role="group" aria-label="大小" id="sizes">
        <button type="button" data-size="s">小</button>
        <button type="button" data-size="m" aria-pressed="true">中</button>
        <button type="button" data-size="l">大</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl">學習單花邊</span>
      <div class="pills" role="group" aria-label="花邊" id="decos">
        <button type="button" data-deco="star" aria-pressed="true">星星</button>
        <button type="button" data-deco="heart">愛心</button>
        <button type="button" data-deco="flower">小花</button>
        <button type="button" data-deco="plain">簡約</button>
      </div>
    </div>

    <hr class="divider">

    <label class="switch" for="showDetails">畫上眼睛、腮紅等細節 <input type="checkbox" id="showDetails" checked></label>
    <label class="switch" for="showAnswer">顯示答案線 <input type="checkbox" id="showAnswer"></label>
    <label class="switch" for="showGrid">背景格線 <input type="checkbox" id="showGrid"></label>

    <hr class="divider">

    <div class="field">
      <label for="title">學習單標題</label>
      <input type="text" id="title" value="連連看" maxlength="16">
    </div>

    <div class="field" id="exportBox">
      <span class="lbl">輸出</span>
      <div class="btn-row">
        <button class="btn primary" type="button" id="printBtn">列印學習單</button>
      </div>
      <div class="btn-row">
        <button class="btn" type="button" id="pngBtn">下載 PNG</button>
        <button class="btn" type="button" id="svgBtn">下載 SVG</button>
      </div>
    </div>
    <p class="note" id="frameNote" hidden>這個預覽視窗不能列印或下載。把 index.html 存到電腦後用瀏覽器開啟，就能列印 A4 學習單、下載 PNG 與 SVG。</p>
  </aside>
</main>

<script>
(() => {
'use strict';
const D = Math.PI / 180;

/* ---------- geometry helpers used by shape definitions ---------- */
function arc(cx, cy, r, a0, a1, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
}
function circleIntersect(x1, y1, r1, x2, y2, r2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  const a = (d * d + r1 * r1 - r2 * r2) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const xm = x1 + a * dx / d, ym = y1 + a * dy / d;
  return [[xm + h * dy / d, ym - h * dx / d], [xm - h * dy / d, ym + h * dx / d]];
}
const ang = (c, p) => Math.atan2(p[1] - c[1], p[0] - c[0]);
function cwArc(cx, cy, r, a, b) {
  while (b <= a) b += 2 * Math.PI;
  return arc(cx, cy, r, a, b, Math.max(6, Math.round((b - a) / (4 * D))));
}
function joinArcs(list) {
  const out = [];
  list.forEach(seg => seg.forEach((p, i) => { if (i === 0 && out.length) return; out.push(p); }));
  const f = out[0], l = out[out.length - 1];
  if (Math.hypot(f[0] - l[0], f[1] - l[1]) < 1e-6) out.pop();
  return out;
}
function stackedCircles(cs) {
  const L = [], R = [];
  for (let i = 0; i < cs.length - 1; i++) {
    const [p, q] = circleIntersect(...cs[i], ...cs[i + 1]);
    L.push(p[0] < q[0] ? p : q); R.push(p[0] < q[0] ? q : p);
  }
  const arcs = [], n = cs.length;
  arcs.push(cwArc(cs[0][0], cs[0][1], cs[0][2], ang(cs[0], R[0]), ang(cs[0], L[0])));
  for (let i = 1; i < n - 1; i++) arcs.push(cwArc(cs[i][0], cs[i][1], cs[i][2], ang(cs[i], L[i - 1]), ang(cs[i], L[i])));

  for (let i = n - 2; i >= 1; i--) arcs.push(cwArc(cs[i][0], cs[i][1], cs[i][2], ang(cs[i], R[i]), ang(cs[i], R[i - 1])));
  return joinArcs(arcs);
}
function polar(cx, cy, n, rf) {
  const p = [];
  for (let i = 0; i < n; i++) { const t = i / n * 2 * Math.PI, r = rf(t); p.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); }
  return p;
}

      }
    }
    labels.push({ x: best[0], y: best[1], t: txt });
  });
  let perim = 0; segs.forEach(([a, b]) => perim += Math.hypot(b[0] - a[0], b[1] - a[1]));
  return { dots, labels, fit, font, r, spacing: perim / dots.length, n: dots.length, cornerMin: minDots(shape) };
}

/* ---------- SVG building ---------- */
const INK = '#2a2f4a';
const NUM_FONT = "Nunito,'Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif";
const CJK_FONT = "'Chiron GoRound TC','PingFang TC','Microsoft JhengHei',sans-serif";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f2 = v => Math.round(v * 100) / 100;
function mix(hex, t) { // blend hex toward white by t
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.round(v + (255 - v) * t).toString(16).padStart(2, '0');
  return '#' + m(r) + m(g) + m(b);
}
function extrasSvg(shape, fit, { color = '#8a94b0', blush = '#ffb3c6', width = 0.55, opacity = 1 } = {}) {
  if (!shape.extras) return '';
  const sw = width / fit.s;
  return `<g transform="translate(${f2(fit.tx)} ${f2(fit.ty)}) scale(${f2(fit.s)})" opacity="${opacity}">
    <style>.x{fill:none;stroke:${color};stroke-width:${f2(sw)};stroke-linecap:round;stroke-linejoin:round}.xf{fill:${color};stroke:none}.xb{fill:${blush};stroke:none}.xw{fill:#fff;stroke:none}</style>
    ${shape.extras}</g>`;
}
function gridSvg() {
  let s = '<g stroke="#d5e2f3" stroke-width="0.15">';
  for (let v = 0; v <= 100; v += 5) s += `<line x1="${v}" y1="0" x2="${v}" y2="100"/><line x1="0" y1="${v}" x2="100" y2="${v}"/>`;
  return s + '</g>';
}
function puzzleInner(c, { answer, details, grid, numbers = true }) {
  const { dots, labels, fit, font, r } = c;
  let s = '';
  if (grid) s += gridSvg();
  if (details) s += extrasSvg(state.shape, fit);
  if (answer) s += `<polygon points="${dots.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="none" stroke="#ff6f96" stroke-width="0.35" stroke-linejoin="round" opacity="0.8"/>`;
  const st = dots[0];
  s += `<circle cx="${f2(st[0])}" cy="${f2(st[1])}" r="${f2(r * 2.4)}" fill="#fff3c4" stroke="#ff6f96" stroke-width="0.35"/>`;
  s += `<g fill="${INK}">` + dots.map(p => `<circle cx="${f2(p[0])}" cy="${f2(p[1])}" r="${r}"/>`).join('') + '</g>';
  if (numbers) {
    s += `<g font-family="${NUM_FONT}" font-size="${font}" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="${INK}" stroke="#fff" stroke-width="${f2(font * 0.24)}" paint-order="stroke" stroke-linejoin="round">`;
    s += labels.map((l, i) => `<text x="${f2(l.x)}" y="${f2(l.y)}"${i === 0 ? ' fill="#e0507a"' : ''}>${esc(l.t)}</text>`).join('');
    s += '</g>';
  }
  return s;
}

/* worksheet decoration motifs */
function motif(type, x, y, s, fill, stroke) {
  const common = `fill="${fill}" stroke="${stroke}" stroke-width="0.5" stroke-linejoin="round"`;
  if (type === 'star') {
    const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.42 : s, a = -90 * D + i * 36 * D; p.push(f2(x + r * Math.cos(a)) + ',' + f2(y + r * Math.sin(a))); }
    return `<polygon points="${p.join(' ')}" ${common}/>`;
  }
  if (type === 'heart') {
    return `<path d="M${x} ${y + s * 0.8} C${x - s * 1.2} ${y} ${x - s * 0.9} ${y - s * 0.9} ${x} ${y - s * 0.35} C${x + s * 0.9} ${y - s * 0.9} ${x + s * 1.2} ${y} ${x} ${y + s * 0.8} Z" ${common}/>`;
  }
  if (type === 'flower') {
    let g = '';
    for (let i = 0; i < 5; i++) { const a = -90 * D + i * 72 * D; g += `<circle cx="${f2(x + s * 0.55 * Math.cos(a))}" cy="${f2(y + s * 0.55 * Math.sin(a))}" r="${f2(s * 0.42)}" ${common}/>`; }
    return g + `<circle cx="${x}" cy="${y}" r="${f2(s * 0.3)}" fill="#ffd84a" stroke="${stroke}" stroke-width="0.5"/>`;
  }
  return `<circle cx="${x}" cy="${y}" r="${f2(s * 0.45)}" ${common}/>`;
}

function sheetSvg(c) {
  const first = labelFor(0), last = labelFor(c.n - 1);
  const title = state.title.trim() || '連連看';
  const col = state.shape.color, soft = mix(col, 0.72), softer = mix(col, 0.88);
  const deco = state.deco, plain = deco === 'plain';
  const m = (x, y, s, f = soft) => plain ? '' : motif(deco, x, y, s, f, INK);
  const corners = plain ? '' : [m(14, 14, 5), m(196, 14, 5), m(14, 283, 5), m(196, 283, 5),
    m(36, 23, 3, '#fff'), m(174, 23, 3, '#fff'), m(26, 32, 2), m(184, 32, 2)].join('');
  // little side-trail of dots along the border, like a connect-the-dots path
  let trail = '';
  if (!plain) for (let i = 0; i < 9; i++) { trail += `<circle cx="9.5" cy="${60 + i * 21}" r="0.9" fill="${col}"/><circle cx="200.5" cy="${60 + i * 21}" r="0.9" fill="${col}"/>`; }
  const tw = Math.min(140, 34 + title.length * 11.5);
  const stars = [0, 1, 2].map(i => motif('star', 150 + i * 9, 266.4, 3.6, '#fff', INK)).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="${CJK_FONT}">
  <rect width="210" height="297" fill="#ffffff"/>
  <rect x="6" y="6" width="198" height="285" rx="12" fill="none" stroke="${plain ? '#d9e0ec' : col}" stroke-width="${plain ? 0.5 : 0.9}" ${plain ? '' : 'stroke-dasharray="0.1 2.6" stroke-linecap="round"'}/>
  ${trail}${corners}
  <path d="M${105 - tw / 2} 15 L${105 + tw / 2} 15 L${105 + tw / 2 - 5} 24 L${105 + tw / 2} 33 L${105 - tw / 2} 33 L${105 - tw / 2 + 5} 24 Z" fill="${soft}" stroke="${INK}" stroke-width="0.5" stroke-linejoin="round"/>
  <text x="105" y="28.2" text-anchor="middle" font-size="12" font-weight="800" fill="${INK}" letter-spacing="1">${esc(title)}</text>
  <g font-size="4.6" fill="${INK}">
    <text x="22" y="45.5">姓名</text><line x1="33" y1="46.5" x2="108" y2="46.5" stroke="${INK}" stroke-width="0.3" stroke-dasharray="1 1"/>
    <text x="118" y="45.5">日期</text><line x1="129" y1="46.5" x2="188" y2="46.5" stroke="${INK}" stroke-width="0.3" stroke-dasharray="1 1"/>
  </g>
  <rect x="14" y="52" width="182" height="182" rx="8" fill="${plain ? '#fff' : mix(col, 0.96)}" stroke="${plain ? '#dfe5ef' : soft}" stroke-width="0.6"/>
  <g transform="translate(15 53) scale(1.8)">${puzzleInner(c, { answer: state.answer, details: state.details, grid: state.grid })}</g>
  <rect x="22" y="239" width="166" height="17" rx="8.5" fill="${softer}"/>
  <g font-size="4.4" fill="${INK}" text-anchor="middle">
    <text x="105" y="246.2">從 <tspan fill="#e0507a" font-weight="800">${esc(first)}</tspan> 開始，依順序連到 <tspan font-weight="800">${esc(last)}</tspan>，最後再連回 <tspan fill="#e0507a" font-weight="800">${esc(first)}</tspan>。</text>
    <text x="105" y="252.6" font-size="3.8">連好之後，猜猜看是什麼，再幫它塗上漂亮的顏色！</text>
  </g>
  <g font-size="4.2" fill="${INK}">
    <text x="22" y="268">我覺得這是：</text><line x1="48" y1="269" x2="112" y2="269" stroke="${INK}" stroke-width="0.3" stroke-dasharray="1 1"/>
    <text x="124" y="268">我給自己</text>
    <text x="175" y="268">顆星</text>
  </g>
  ${stars}
  <g font-size="3.2" fill="#8a94b0">
    <text x="22" y="281">塗色建議</text>
    <circle cx="39" cy="279.9" r="2.2" fill="${col}" stroke="${INK}" stroke-width="0.3"/>
    <circle cx="45" cy="279.9" r="2.2" fill="${soft}" stroke="${INK}" stroke-width="0.3"/>
    <circle cx="51" cy="279.9" r="2.2" fill="#ffb3c6" stroke="${INK}" stroke-width="0.3"/>
    <text x="188" y="281" text-anchor="end">共 ${c.n} 個點</text>
  </g>
</svg>`;
}

/* ---------- library ---------- */
const $ = id => document.getElementById(id);
const grid = $('grid'), chips = $('chips');
function thumbSvg(shape) {
  const fit = fitOf(shape);
  const pts = outlineOf(shape).pts.map(fit.map);
  return `<svg viewBox="-2 -2 104 104" aria-hidden="true"><polygon points="${pts.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="${mix(shape.color, 0.25)}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>${extrasSvg(shape, fit, { color: INK, blush: '#ff8fab', width: 1.8 })}</svg>`;
}
function buildLibrary() {
  chips.innerHTML = CATS.map(c => {
    const n = c === '全部' ? SHAPES.length : SHAPES.filter(s => s.cat === c).length;
    return `<button type="button" class="chip" data-cat="${c}" aria-pressed="${c === state.cat}">${c}<span class="n">${n}</span></button>`;
  }).join('');
  grid.innerHTML = SHAPES.map((s, i) => `<button type="button" class="tile" style="--tint:${s.color}" data-id="${s.id}" data-cat="${s.cat}" aria-pressed="false" title="${s.name}">
      <span class="no">${String(i + 1).padStart(2, '0')}</span>${thumbSvg(s)}<span class="nm">${s.name}</span></button>`).join('');
}
function syncLibrary() {
  chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
  let count = 0;
  grid.querySelectorAll('.tile').forEach(t => {
    const show = state.cat === '全部' || t.dataset.cat === state.cat;
    t.hidden = !show; if (show) count++;
    t.setAttribute('aria-pressed', String(t.dataset.id === state.shape.id));
  });
  $('libCount').textContent = `${count} 種`;
}

let current = null;
function render() {
  current = compute();
  const c = current;
  $('dotsOut').textContent = c.n;
  $('dots').value = Math.max(state.n, 10);
  document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === state.n)));
  $('meta').innerHTML = `<b class="nm">${state.shape.name}</b> · 共 <b>${c.n}</b> 點 · <b>${esc(labelFor(0))}</b> → <b>${esc(labelFor(c.n - 1))}</b>`;
  const w = $('warn');
  if (c.n > state.n) { w.hidden = false; w.textContent = `「${state.shape.name}」有 ${c.cornerMin} 個轉角，至少需要 ${c.cornerMin} 個點。`; }
  else if (c.spacing < c.font * 1.25) { w.hidden = false; w.textContent = '點有點密，數字可能會擠在一起。可以減少點數，或把字調小。'; }
  else w.hidden = true;
  $('sheet').innerHTML = sheetSvg(c);
  syncLibrary();
  if (state.mode === 'play') startPlay();
  try { history.replaceState(null, '', '#' + state.shape.id); } catch (e) {}
}

/* ---------- play mode ---------- */
let play = null, idleTimer = null;
function startPlay() {
  const c = current;
  play = { next: 0, done: false };
  const hitR = Math.max(1.6, Math.min(3.2, c.spacing * 0.48));
  $('board').innerHTML = `<svg viewBox="0 0 100 100" id="playSvg">
    ${state.grid ? gridSvg() : ''}
    <polygon id="fillPoly" points="${c.dots.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="${state.shape.color}" opacity="0" stroke="none"/>
    <g id="detailLayer">${state.details ? extrasSvg(state.shape, c.fit) : ''}</g>
    <polyline id="path" points="" fill="none" stroke="#ff6f96" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="playStatic">${puzzleInner(c, { answer: false, details: false, grid: false })}</g>
    <circle id="pulse" r="${c.r * 1.7}" fill="#ffd84a" opacity="0" class="pulse"/>
    <g id="hits">${c.dots.map((p, i) => `<circle class="hit" data-i="${i}" cx="${f2(p[0])}" cy="${f2(p[1])}" r="${f2(hitR)}" fill="transparent"/>`).join('')}</g>
  </svg>`;
  $('hits').addEventListener('pointerdown', e => {
    const t = e.target.closest('.hit'); if (!t) return;
    e.preventDefault(); tapDot(Number(t.dataset.i), t);
  });
  updatePlay();
}
function armIdleHint() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (play && !play.done && state.mode === 'play') showHint(); }, 8000);
}
function updatePlay() {
  const c = current;
  const pts = c.dots.slice(0, play.next).map(p => f2(p[0]) + ',' + f2(p[1]));
  if (play.done) pts.push(f2(c.dots[0][0]) + ',' + f2(c.dots[0][1]));
  $('path').setAttribute('points', pts.join(' '));
  $('nextLabel').textContent = play.done ? '完成' : labelFor(play.next);
  $('progressBar').style.width = (play.done ? 100 : play.next / c.n * 100) + '%';
  $('pulse').setAttribute('opacity', '0');
  armIdleHint();
}
function tapDot(i, el) {
  if (!play || play.done) return;
  if (i === play.next) {
    const dot = $('playStatic').querySelectorAll('g > circle')[i + 1];
    if (dot) { dot.classList.remove('boop'); void dot.getBBox(); dot.classList.add('boop'); dot.setAttribute('fill', '#ff6f96'); }
    play.next++;
    if (play.next === current.n) finishPlay();
    updatePlay();
  } else {
    el.setAttribute('stroke', '#ff6f96'); el.setAttribute('stroke-width', '0.3'); el.setAttribute('stroke-dasharray', '0.6 0.6');
    setTimeout(() => el.removeAttribute('stroke'), 450);
  }
}
function finishPlay() {
  play.done = true;
  clearTimeout(idleTimer);
  const fp = $('fillPoly'); fp.setAttribute('opacity', '1'); fp.classList.add('reveal');
  $('detailLayer').innerHTML = extrasSvg(state.shape, current.fit, { color: INK, blush: '#ff8fab', width: 0.7 });
  $('playStatic').setAttribute('opacity', '0.18');
  const card = document.createElement('div');
  card.className = 'done-card';
  card.innerHTML = `完成！是${esc(state.shape.name)} <button type="button">再玩一個</button>`;
  card.querySelector('button').onclick = () => { const pool = SHAPES.filter(s => s !== state.shape); selectShape(pool[Math.floor(Math.random() * pool.length)].id); };
  $('board').appendChild(card);
  confetti();
}
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const board = $('board'), cv = document.createElement('canvas');
  const W = board.clientWidth, H = board.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; board.appendChild(cv);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cols = ['#ff6f96', '#ffd84a', '#4f8cff', '#5fd3a9', '#c08cf0', state.shape.color];
  const ps = Array.from({ length: 90 }, () => ({ x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3,
    r: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, round: Math.random() < 0.4 }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += 0.25; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.r * 0.6, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore(); });
    if (++t < 130) requestAnimationFrame(frame); else cv.remove();
  })();
}
function showHint() {
  if (!play || play.done) return;
  const p = current.dots[play.next], pu = $('pulse');
  pu.setAttribute('cx', p[0]); pu.setAttribute('cy', p[1]); pu.setAttribute('opacity', '0.9');
}
$('hintBtn').onclick = showHint;
$('undoBtn').onclick = () => {
  if (!play || play.done || play.next === 0) return;
  play.next--;
  const dot = $('playStatic').querySelectorAll('g > circle')[play.next + 1];
  if (dot) dot.removeAttribute('fill');
  updatePlay();
};
$('restartBtn').onclick = () => startPlay();

/* ---------- controls ---------- */
function setMode(m) {
  state.mode = m;
  $('modeSheet').setAttribute('aria-pressed', String(m === 'sheet'));
  $('modePlay').setAttribute('aria-pressed', String(m === 'play'));
  $('sheetView').hidden = m !== 'sheet';
  $('play').hidden = m !== 'play';
  if (m === 'play') startPlay(); else clearTimeout(idleTimer);
}
$('modeSheet').onclick = () => setMode('sheet');
$('modePlay').onclick = () => setMode('play');
function selectShape(id) {
  const s = SHAPES.find(x => x.id === id); if (!s) return;
  state.shape = s; state.offset = 0; state.n = s.n;
  render();
}
function pressOnly(container, btn) { container.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === btn))); }
grid.addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) selectShape(t.dataset.id); });
chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state.cat = b.dataset.cat; syncLibrary(); } });
$('randomBtn').onclick = () => {
  const pool = SHAPES.filter(s => (state.cat === '全部' || s.cat === state.cat) && s !== state.shape);
  selectShape(pool[Math.floor(Math.random() * pool.length)].id);
};
$('dots').addEventListener('input', e => { state.n = Number(e.target.value); render(); });
$('presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.n = Number(b.dataset.n); render(); } });
$('labelMode').onchange = e => { state.labelMode = e.target.value; render(); };
$('dirCw').onclick = () => { state.reverse = false; $('dirCw').setAttribute('aria-pressed', 'true'); $('dirCcw').setAttribute('aria-pressed', 'false'); render(); };
$('dirCcw').onclick = () => { state.reverse = true; $('dirCw').setAttribute('aria-pressed', 'false'); $('dirCcw').setAttribute('aria-pressed', 'true'); render(); };
$('shuffleStart').onclick = () => { state.offset += 3 + Math.floor(Math.random() * Math.max(1, current.n - 6)); render(); };
$('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.size = b.dataset.size; pressOnly($('sizes'), b); render(); });
$('decos').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.deco = b.dataset.deco; pressOnly($('decos'), b); render(); });
$('showDetails').onchange = e => { state.details = e.target.checked; render(); };
$('showAnswer').onchange = e => { state.answer = e.target.checked; render(); };
$('showGrid').onchange = e => { state.grid = e.target.checked; render(); };
$('title').addEventListener('input', e => { state.title = e.target.value; $('sheet').innerHTML = sheetSvg(current); });

/* ---------- export ---------- */
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (inFrame) { $('exportBox').hidden = true; $('frameNote').hidden = false; }
const fileBase = () => `連連看-${state.shape.name}-${current.n}點`;
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('printBtn').onclick = () => { setMode('sheet'); window.print(); };
$('svgBtn').onclick = () => download(new Blob([sheetSvg(current)], { type: 'image/svg+xml' }), fileBase() + '.svg');
$('pngBtn').onclick = () => {
  const svg = sheetSvg(current).replace('width="210mm" height="297mm"', 'width="2480" height="3508"');
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = 2480; cv.height = 3508;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => download(b, fileBase() + '.png'), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};

/* ---------- boot ---------- */
buildLibrary();
const fromHash = SHAPES.find(s => '#' + s.id === location.hash);
if (fromHash) state.shape = fromHash;
state.n = state.shape.n;
render();
window.__ctd = { SHAPES, state, selectShape, render, setMode, sheetSvg: () => sheetSvg(current), compute };
})();
</script>
</body>
</html>
