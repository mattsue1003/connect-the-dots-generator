<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連連看生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: notebook desk — pattern library on the left, an A4 worksheet in the middle, settings on the right; stacks to one column on phones. */
:root {
  --bg: #e9eef5;
  --panel: #f8fafd;
  --ink: #1c2742;
  --muted: #5b6884;
  --line: #cdd6e4;
  --accent: #2b55d6;
  --accent-soft: #dfe7fc;
  --marker: #ffd447;
  --good: #188a5f;
  --warn: #b5551c;
  --sheet: #ffffff;
  --sheet-ink: #1c2742;
  --shadow: 0 1px 2px rgba(28,39,66,.08), 0 10px 30px -12px rgba(28,39,66,.25);
  --font-display: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111727; --panel: #1a2236; --ink: #e6ebf6; --muted: #9aa6c2; --line: #2e3a55;
    --accent: #7d9bff; --accent-soft: #24315a; --marker: #ffd447; --good: #4cc995; --warn: #f0a46a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111727; --panel: #1a2236; --ink: #e6ebf6; --muted: #9aa6c2; --line: #2e3a55;
  --accent: #7d9bff; --accent-soft: #24315a; --marker: #ffd447; --good: #4cc995; --warn: #f0a46a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 32px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top {
  max-width: 1440px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px;
  padding-block: 22px 16px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0;
  text-wrap: balance;
}
.brand h1 mark { background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; padding: 0 2px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.app {
  max-width: 1440px; margin: 0 auto;
  display: grid; gap: 20px;
  grid-template-columns: 300px minmax(0, 1fr) 290px;
  grid-template-areas: "lib stage ctrl";
  align-items: start;
}
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; min-width: 0;
}
.panel h2 {
  font-family: var(--font-display); font-size: 16px; font-weight: 800; margin: 0 0 10px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.panel h2 small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 12px; }

/* Library */
.library { grid-area: lib; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 3px 12px; font-size: 13px; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  overflow-y: auto; padding: 2px; margin: -2px; flex: 1;
}
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--sheet); border: 2px solid transparent; border-radius: 10px;
  padding: 6px 4px 5px; position: relative; color: var(--sheet-ink);
}
.tile svg { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.tile span { font-size: 13px; font-weight: 500; }
.tile .no { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #8792aa; font-variant-numeric: tabular-nums; }
.tile:hover { border-color: var(--line); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lib-foot { margin-top: 12px; display: flex; gap: 8px; }

/* Stage */
.stage { grid-area: stage; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 500; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); }
.sheet-wrap { display: flex; justify-content: center; }
#sheet {
  width: 100%; max-width: 640px; background: var(--sheet); border-radius: 6px; box-shadow: var(--shadow);
  aspect-ratio: 210 / 297; overflow: hidden;
}
#sheet svg { width: 100%; height: 100%; display: block; }
.warn {
  font-size: 13px; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border-radius: 8px; padding: 6px 10px; max-width: 640px; margin: 0 auto; width: 100%;
}

/* Play mode */
#play { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.play-board {
  width: 100%; max-width: 640px; background: var(--sheet); border-radius: 12px; box-shadow: var(--shadow);
  position: relative; aspect-ratio: 1; overflow: hidden; touch-action: manipulation;
}
.play-board svg { width: 100%; height: 100%; display: block; }
.play-hud {
  width: 100%; max-width: 640px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between;
}
.next-pill {
  display: inline-flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 14px; font-size: 14px;
}
.next-pill b { font-family: var(--font-display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: center; }
.progress { flex: 1; min-width: 120px; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--good); transition: width .2s; }
.play-actions { display: flex; gap: 8px; }
.done-card {
  position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%);
  background: var(--ink); color: var(--panel); border-radius: 999px; padding: 8px 22px;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; white-space: nowrap;
  animation: pop .45s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
.hit { cursor: pointer; }
.shake { animation: shake .35s; transform-box: fill-box; transform-origin: center; }
@keyframes shake { 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
.pulse { animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.9); } }
.reveal { animation: reveal .8s ease forwards; }
@keyframes reveal { from { opacity: 0; } to { opacity: 1; } }

/* Controls */
.controls { grid-area: ctrl; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.field > label output, .field .lbl output { font-family: var(--font-display); font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="text"], select {
  width: 100%; border: 1px solid var(--line); background: var(--sheet); color: var(--sheet-ink);
  border-radius: 8px; padding: 7px 10px;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button {
  border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 13px;
}
.pills button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; cursor: pointer; }
.switch input { width: 40px; height: 22px; accent-color: var(--accent); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .btn { flex: 1; }
.divider { border: 0; border-top: 1px dashed var(--line); margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }

@media (max-width: 1180px) {
  .app { grid-template-columns: 280px minmax(0, 1fr); grid-template-areas: "lib stage" "lib ctrl"; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "lib" "stage" "ctrl"; }
  .library { position: static; max-height: none; }
  .grid { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 92px; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .brand h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; padding: 0; }
  header.top, .library, .controls, .stage-bar, .warn, #play { display: none !important; }
  .app { display: block; max-width: none; }
  #sheet { box-shadow: none; border-radius: 0; max-width: none; width: 210mm; height: 297mm; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <rect x="1" y="1" width="42" height="42" rx="10" fill="var(--accent)"/>
      <path d="M11 30 L18 13 L26 24 L33 15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="var(--marker)"><circle cx="11" cy="30" r="3"/><circle cx="18" cy="13" r="3"/><circle cx="26" cy="24" r="3"/><circle cx="33" cy="15" r="3"/></g>
    </svg>
    <div>
      <h1><mark>連連看</mark>生成器</h1>
      <p>挑一個圖案，調好點數，印成學習單或直接在線上連連看。</p>
    </div>
  </div>
</header>

<main class="app">
  <aside class="panel library" aria-label="圖案庫">
    <h2>圖案庫 <small id="libCount">30 種</small></h2>
    <div class="chips" id="chips" role="group" aria-label="分類"></div>
    <div class="grid" id="grid"></div>
    <div class="lib-foot">
      <button class="btn small" id="randomBtn" type="button" style="flex:1">隨機挑一個</button>
    </div>
  </aside>

  <section class="stage" aria-label="預覽">
    <div class="stage-bar">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="modeSheet" aria-pressed="true">學習單</button>
        <button type="button" id="modePlay" aria-pressed="false">線上玩</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div id="warn" class="warn" hidden></div>
    <div id="sheetView" class="sheet-wrap"><div id="sheet"></div></div>
    <div id="play" hidden>
      <div class="play-hud">
        <span class="next-pill">下一個 <b id="nextLabel">1</b></span>
        <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
        <div class="play-actions">
          <button class="btn small" type="button" id="hintBtn">提示</button>
          <button class="btn small" type="button" id="undoBtn">復原</button>
          <button class="btn small" type="button" id="restartBtn">重來</button>
        </div>
      </div>
      <div class="play-board" id="board"></div>
    </div>
  </section>

  <aside class="panel controls" aria-label="設定">
    <div class="field">
      <label for="dots">點的數量 <output id="dotsOut">40</output></label>
      <input type="range" id="dots" min="10" max="150" step="1" value="40">
      <div class="pills" id="presets" role="group" aria-label="難度">
        <button type="button" data-n="20">簡單 20</button>
        <button type="button" data-n="40">普通 40</button>
        <button type="button" data-n="70">進階 70</button>
        <button type="button" data-n="110">挑戰 110</button>
      </div>
      <span class="hint">轉角一定會放點，所以有稜有角的圖案點數下限會高一些。</span>
    </div>

    <div class="field">
      <label for="labelMode">數字怎麼數</label>
      <select id="labelMode">
        <option value="1">1、2、3、4…</option>
        <option value="2">2、4、6、8…（兩個一數）</option>
        <option value="5">5、10、15…（五個一數）</option>
        <option value="10">10、20、30…（十個一數）</option>
        <option value="abc">A、B、C…（英文字母）</option>
      </select>
    </div>

    <div class="field">
      <span class="lbl">方向與起點</span>
      <div class="pills" role="group" aria-label="方向">
        <button type="button" id="dirCw" aria-pressed="true">順時針</button>
        <button type="button" id="dirCcw" aria-pressed="false">逆時針</button>
        <button type="button" id="shuffleStart">換個起點</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl">字與點的大小</span>
      <div class="pills" role="group" aria-label="大小" id="sizes">
        <button type="button" data-size="s">小</button>
        <button type="button" data-size="m" aria-pressed="true">中</button>
        <button type="button" data-size="l">大</button>
      </div>
    </div>

    <hr class="divider">

    <label class="switch" for="showDetails">畫上眼睛、窗戶等細節 <input type="checkbox" id="showDetails" checked></label>
    <label class="switch" for="showAnswer">顯示答案線 <input type="checkbox" id="showAnswer"></label>
    <label class="switch" for="showGrid">背景格線 <input type="checkbox" id="showGrid"></label>

    <hr class="divider">

    <div class="field">
      <label for="title">學習單標題</label>
      <input type="text" id="title" value="連連看" maxlength="24">
    </div>

    <div class="field" id="exportBox">
      <span class="lbl">輸出</span>
      <div class="btn-row">
        <button class="btn primary" type="button" id="printBtn">列印學習單</button>
      </div>
      <div class="btn-row">
        <button class="btn" type="button" id="pngBtn">下載 PNG</button>
        <button class="btn" type="button" id="svgBtn">下載 SVG</button>
      </div>
    </div>
    <p class="note" id="frameNote" hidden>這個預覽視窗不能列印或下載。把 index.html 存到電腦後用瀏覽器開啟，就能列印 A4 學習單、下載 PNG 與 SVG。</p>
  </aside>
</main>

<script>
(() => {
'use strict';
const D = Math.PI / 180;

/* ---------- geometry helpers used by the shape definitions ---------- */
function arc(cx, cy, r, a0, a1, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
function circleIntersect(x1, y1, r1, x2, y2, r2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  const a = (d * d + r1 * r1 - r2 * r2) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const xm = x1 + a * dx / d, ym = y1 + a * dy / d;
  return [[xm + h * dy / d, ym - h * dx / d], [xm - h * dy / d, ym + h * dx / d]];
}
const ang = (c, p) => Math.atan2(p[1] - c[1], p[0] - c[0]);
// clockwise (on screen) arc from angle a to angle b
function cwArc(cx, cy, r, a, b) {
  while (b <= a) b += 2 * Math.PI;
  const n = Math.max(6, Math.round((b - a) / (4 * D)));
  return arc(cx, cy, r, a, b, n);
}
function joinArcs(list) {
  const out = [];
  list.forEach(seg => seg.forEach((p, i) => { if (i === 0 && out.length) return; out.push(p); }));
  const f = out[0], l = out[out.length - 1];
  if (Math.hypot(f[0] - l[0], f[1] - l[1]) < 1e-6) out.pop();
  return out;
}
// outline of circles stacked bottom → top (snowman)
function stackedCircles(cs) {
  const L = [], R = [];
  for (let i = 0; i < cs.length - 1; i++) {
    const [p, q] = circleIntersect(...cs[i], ...cs[i + 1]);
    L.push(p[0] < q[0] ? p : q); R.push(p[0] < q[0] ? q : p);
  }
  const C = c => [c[0], c[1]];
  const arcs = [];
  const n = cs.length;
  arcs.push(cwArc(cs[0][0], cs[0][1], cs[0][2], ang(C(cs[0]), R[0]), ang(C(cs[0]), L[0])));
  for (let i = 1; i < n - 1; i++) arcs.push(cwArc(cs[i][0], cs[i][1], cs[i][2], ang(C(cs[i]), L[i - 1]), ang(C(cs[i]), L[i])));
  const t = cs[n - 1];
  arcs.push(cwArc(t[0], t[1], t[2], ang(C(t), L[n - 2]), ang(C(t), R[n - 2])));
  for (let i = n - 2; i >= 1; i--) arcs.push(cwArc(cs[i][0], cs[i][1], cs[i][2], ang(C(cs[i]), R[i]), ang(C(cs[i]), R[i - 1])));
  return joinArcs(arcs);
}

/* ---------- the 30 patterns ----------
   d: SVG path (M L H V Q C Z, absolute) or fn: returns closed point list.
   extras: decorative strokes in the same coordinates (class "x" = line, "xf" = filled). */
const SHAPES = [
  { id: 'heart', name: '愛心', cat: '形狀', color: '#f05a7a', n: 30,
    fn: () => { const p = []; for (let i = 0; i < 240; i++) { const t = i / 240 * 2 * Math.PI;
      p.push([50 + 16 * Math.pow(Math.sin(t), 3) * 2.6, 48 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 2.6]); } return p; },
    extras: '' },
  { id: 'star', name: '星星', cat: '形狀', color: '#f6bd2b', n: 30,
    fn: () => { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 19 : 46, a = -90 * D + i * 36 * D; p.push([50 + r * Math.cos(a), 54 + r * Math.sin(a)]); } return p; },
    extras: '<circle class="xf" cx="43" cy="52" r="2"/><circle class="xf" cx="57" cy="52" r="2"/><path class="x" d="M45 60 Q50 64 55 60"/>' },
  { id: 'diamond', name: '鑽石', cat: '形狀', color: '#5cc8e8', n: 25,
    d: 'M30 15 L70 15 L90 38 L50 90 L10 38 Z',
    extras: '<path class="x" d="M10 38 L90 38 M30 15 L40 38 L50 15 L60 38 L70 15 M40 38 L50 90 L60 38"/>' },
  { id: 'fish', name: '小魚', cat: '動物', color: '#ff8a3d', n: 35,
    d: 'M12 50 C25 25 55 22 70 44 L88 28 L83 50 L88 72 L70 56 C55 78 25 75 12 50 Z',
    extras: '<circle class="xf" cx="27" cy="46" r="2.6"/><path class="x" d="M38 37 Q45 50 38 63 M48 45 Q51 50 48 55 M56 45 Q59 50 56 55"/><circle class="x" cx="6" cy="38" r="2"/><circle class="x" cx="3" cy="30" r="1.4"/>' },
  { id: 'cat', name: '貓咪', cat: '動物', color: '#f2a65a', n: 40,
    d: 'M20 85 C10 70 12 50 20 40 L18 12 L40 30 C46 28 54 28 60 30 L82 12 L80 40 C88 50 90 70 80 85 C65 95 35 95 20 85 Z',

      const q = [p[0] + vx * dist, p[1] + vy * dist];
      let clear = Infinity;
      dots.forEach((o, j) => { if (j !== i) clear = Math.min(clear, Math.hypot(q[0] - o[0], q[1] - o[1]) - r); });
      labels.forEach(l => { clear = Math.min(clear, Math.hypot(q[0] - l.x, q[1] - l.y) - font * 0.25); });
      segs.forEach(([s1, s2]) => { clear = Math.min(clear, distSeg(q, s1, s2) + font * 0.1); });
      if (q[0] < 1 || q[0] > 99) clear -= 5;
      const score = clear - Math.abs(da) * 0.004;
      if (clear >= font * 0.62) { best = q; break; }
      if (score > bestScore) { bestScore = score; best = q; }
    }
    labels.push({ x: best[0], y: best[1], t: txt });
  });
  let perim = 0; segs.forEach(([a, b]) => perim += Math.hypot(b[0] - a[0], b[1] - a[1]));
  return { dots, labels, fit, font, r, spacing: perim / dots.length, n: dots.length, cornerMin: minDots(shape) };
}

/* ---------- SVG building ---------- */
const INK = '#1c2742';
const NUM_FONT = "'Nunito','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif";
const CJK_FONT = "'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f2 = v => Math.round(v * 100) / 100;

function extrasSvg(shape, fit, color, opacity) {
  if (!shape.extras) return '';
  const sw = 0.55 / fit.s;
  return `<g transform="translate(${f2(fit.tx)} ${f2(fit.ty)}) scale(${f2(fit.s)})" opacity="${opacity}">
    <style>.x{fill:none;stroke:${color};stroke-width:${f2(sw)};stroke-linecap:round;stroke-linejoin:round}.xf{fill:${color};stroke:none}</style>
    ${shape.extras}</g>`;
}

function gridSvg() {
  let s = '<g stroke="#c9d6ea" stroke-width="0.15">';
  for (let v = 0; v <= 100; v += 5) s += `<line x1="${v}" y1="0" x2="${v}" y2="100"/><line x1="0" y1="${v}" x2="100" y2="${v}"/>`;
  return s + '</g>';
}

function puzzleInner(c, { answer, details, grid, numbers = true }) {
  const { dots, labels, fit, font, r } = c;
  let s = '';
  if (grid) s += gridSvg();
  if (details) s += extrasSvg(state.shape, fit, '#7d8aa6', 0.9);
  if (answer) s += `<polygon points="${dots.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="none" stroke="#e05a73" stroke-width="0.35" stroke-linejoin="round" opacity="0.75"/>`;
  // start marker
  const st = dots[0];
  s += `<circle cx="${f2(st[0])}" cy="${f2(st[1])}" r="${f2(r * 2.3)}" fill="none" stroke="#2b55d6" stroke-width="0.35"/>`;
  s += `<g fill="${INK}">` + dots.map(p => `<circle cx="${f2(p[0])}" cy="${f2(p[1])}" r="${r}"/>`).join('') + '</g>';
  if (numbers) {
    s += `<g font-family="${NUM_FONT}" font-size="${font}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${INK}" stroke="#fff" stroke-width="${f2(font * 0.22)}" paint-order="stroke" stroke-linejoin="round">`;
    s += labels.map((l, i) => `<text x="${f2(l.x)}" y="${f2(l.y)}"${i === 0 ? ' fill="#2b55d6"' : ''}>${esc(l.t)}</text>`).join('');
    s += '</g>';
  }
  return s;
}

function sheetSvg(c) {
  const first = labelFor(0), last = labelFor(c.n - 1);
  const title = state.title.trim() || '連連看';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="${CJK_FONT}">
  <rect width="210" height="297" fill="#ffffff"/>
  <text x="105" y="27" text-anchor="middle" font-size="13" font-weight="800" fill="${INK}">${esc(title)}</text>
  <g font-size="5" fill="${INK}" stroke="none">
    <text x="22" y="43">姓名</text><line x1="35" y1="44" x2="110" y2="44" stroke="${INK}" stroke-width="0.3"/>
    <text x="120" y="43">日期</text><line x1="133" y1="44" x2="188" y2="44" stroke="${INK}" stroke-width="0.3"/>
  </g>
  <rect x="14" y="52" width="182" height="182" rx="4" fill="none" stroke="#d6deea" stroke-width="0.4"/>
  <g transform="translate(15 53) scale(1.8)">${puzzleInner(c, { answer: state.answer, details: state.details, grid: state.grid })}</g>
  <g font-size="5" fill="${INK}" text-anchor="middle">
    <text x="105" y="249">從 <tspan fill="#2b55d6" font-weight="800">${esc(first)}</tspan> 開始，依順序連到 <tspan font-weight="800">${esc(last)}</tspan>，最後再連回 ${esc(first)}。</text>
    <text x="105" y="258">連好之後，猜猜看是什麼，再幫它塗上顏色！</text>
  </g>
  <g font-size="4.2" fill="${INK}">
    <text x="22" y="276">我覺得這是：</text><line x1="50" y1="277" x2="120" y2="277" stroke="${INK}" stroke-width="0.3"/>
  </g>
  <text x="188" y="288" text-anchor="end" font-size="3" fill="#8a95ad">共 ${c.n} 個點</text>
</svg>`;
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const grid = $('grid'), chips = $('chips');

function thumbSvg(shape) {
  const fit = fitOf(shape);
  const pts = outlineOf(shape).pts.map(fit.map);
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${pts.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="${shape.color}" fill-opacity="0.35" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>${extrasSvg(shape, { ...fit, s: fit.s }, INK, 0.7).replace(/stroke-width:[\d.]+/, 'stroke-width:' + f2(1.6 / fit.s))}</svg>`;
}

function buildLibrary() {
  chips.innerHTML = CATS.map(c => `<button type="button" class="chip" data-cat="${c}" aria-pressed="${c === state.cat}">${c}</button>`).join('');
  grid.innerHTML = SHAPES.map((s, i) => `<button type="button" class="tile" data-id="${s.id}" data-cat="${s.cat}" aria-pressed="false" title="${s.name}">
      <span class="no">${String(i + 1).padStart(2, '0')}</span>${thumbSvg(s)}<span>${s.name}</span></button>`).join('');
}
function syncLibrary() {
  chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
  let count = 0;
  grid.querySelectorAll('.tile').forEach(t => {
    const show = state.cat === '全部' || t.dataset.cat === state.cat;
    t.hidden = !show; if (show) count++;
    t.setAttribute('aria-pressed', String(t.dataset.id === state.shape.id));
  });
  $('libCount').textContent = `${count} 種`;
}

let current = null;
function render() {
  current = compute();
  const c = current;
  $('dotsOut').textContent = c.n;
  $('dots').value = Math.max(state.n, 10);
  document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === state.n)));
  $('meta').innerHTML = `圖案 <b>${state.shape.name}</b> · 共 <b>${c.n}</b> 點 · ${labelFor(0)} → ${labelFor(c.n - 1)}`;
  const w = $('warn');
  if (c.n > state.n) { w.hidden = false; w.textContent = `「${state.shape.name}」有 ${c.cornerMin} 個轉角，至少需要 ${c.cornerMin} 個點。`; }
  else if (c.spacing < c.font * 1.25) { w.hidden = false; w.textContent = '點有點密，數字可能擠在一起。可以減少點數或把字調小。'; }
  else w.hidden = true;
  $('sheet').innerHTML = sheetSvg(c);
  syncLibrary();
  if (state.mode === 'play') startPlay();
  try { history.replaceState(null, '', '#' + state.shape.id); } catch (e) {}
}

/* ---------- play mode ---------- */
let play = null;
function startPlay() {
  const c = current;
  play = { next: 0, done: false };
  const hitR = Math.max(1.6, Math.min(3.2, c.spacing * 0.48));
  $('board').innerHTML = `<svg viewBox="0 0 100 100" id="playSvg">
    ${state.grid ? gridSvg() : ''}
    <polygon id="fillPoly" points="${c.dots.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="${state.shape.color}" opacity="0" stroke="none"/>
    <g id="detailLayer">${state.details ? extrasSvg(state.shape, c.fit, '#7d8aa6', 0.9) : ''}</g>
    <polyline id="path" points="" fill="none" stroke="#2b55d6" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="playStatic">${puzzleInner(c, { answer: false, details: false, grid: false })}</g>
    <circle id="pulse" r="${c.r * 1.6}" fill="#ffd447" opacity="0" class="pulse"/>
    <g id="hits">${c.dots.map((p, i) => `<circle class="hit" data-i="${i}" cx="${f2(p[0])}" cy="${f2(p[1])}" r="${f2(hitR)}" fill="transparent"/>`).join('')}</g>
  </svg>`;
  $('hits').addEventListener('pointerdown', e => {
    const t = e.target.closest('.hit'); if (!t) return;
    e.preventDefault(); tapDot(Number(t.dataset.i), t);
  });
  updatePlay();
}
function updatePlay() {
  const c = current;
  const pts = c.dots.slice(0, play.next).map(p => f2(p[0]) + ',' + f2(p[1]));
  if (play.done) pts.push(f2(c.dots[0][0]) + ',' + f2(c.dots[0][1]));
  $('path').setAttribute('points', pts.join(' '));
  $('nextLabel').textContent = play.done ? '完成' : labelFor(play.next);
  $('progressBar').style.width = (play.done ? 100 : play.next / c.n * 100) + '%';
  $('pulse').setAttribute('opacity', '0');
}
function tapDot(i, el) {
  if (!play || play.done) return;
  if (i === play.next) {
    play.next++;
    if (play.next === current.n) finishPlay();
    updatePlay();
  } else {
    el.classList.remove('shake'); void el.getBBox(); el.setAttribute('stroke', '#e05a73'); el.setAttribute('stroke-width', '0.3');
    setTimeout(() => el.removeAttribute('stroke'), 450);
  }
}
function finishPlay() {
  play.done = true;
  const fp = $('fillPoly'); fp.setAttribute('opacity', '1'); fp.classList.add('reveal');
  $('detailLayer').innerHTML = extrasSvg(state.shape, current.fit, INK, 1);
  $('playStatic').setAttribute('opacity', '0.25');
  const card = document.createElement('div');
  card.className = 'done-card'; card.textContent = `完成！是${state.shape.name}`;
  $('board').appendChild(card);
}
$('hintBtn').onclick = () => { if (!play || play.done) return; const p = current.dots[play.next]; const pu = $('pulse'); pu.setAttribute('cx', p[0]); pu.setAttribute('cy', p[1]); pu.setAttribute('opacity', '0.9'); };
$('undoBtn').onclick = () => { if (!play || play.done || play.next === 0) return; play.next--; updatePlay(); };
$('restartBtn').onclick = () => startPlay();

/* ---------- controls ---------- */
function setMode(m) {
  state.mode = m;
  $('modeSheet').setAttribute('aria-pressed', String(m === 'sheet'));
  $('modePlay').setAttribute('aria-pressed', String(m === 'play'));
  $('sheetView').hidden = m !== 'sheet';
  $('play').hidden = m !== 'play';
  if (m === 'play') startPlay();
}
$('modeSheet').onclick = () => setMode('sheet');
$('modePlay').onclick = () => setMode('play');

function selectShape(id) {
  const s = SHAPES.find(x => x.id === id); if (!s) return;
  state.shape = s; state.offset = 0; state.n = s.n;
  render();
}
grid.addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) selectShape(t.dataset.id); });
chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state.cat = b.dataset.cat; syncLibrary(); } });
$('randomBtn').onclick = () => {
  const pool = SHAPES.filter(s => (state.cat === '全部' || s.cat === state.cat) && s !== state.shape);
  selectShape(pool[Math.floor(Math.random() * pool.length)].id);
};
$('dots').addEventListener('input', e => { state.n = Number(e.target.value); render(); });
$('presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.n = Number(b.dataset.n); render(); } });
$('labelMode').onchange = e => { state.labelMode = e.target.value; render(); };
$('dirCw').onclick = () => { state.reverse = false; $('dirCw').setAttribute('aria-pressed', 'true'); $('dirCcw').setAttribute('aria-pressed', 'false'); render(); };
$('dirCcw').onclick = () => { state.reverse = true; $('dirCw').setAttribute('aria-pressed', 'false'); $('dirCcw').setAttribute('aria-pressed', 'true'); render(); };
$('shuffleStart').onclick = () => { state.offset += 3 + Math.floor(Math.random() * Math.max(1, current.n - 6)); render(); };
$('sizes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.size = b.dataset.size;
  $('sizes').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
$('showDetails').onchange = e => { state.details = e.target.checked; render(); };
$('showAnswer').onchange = e => { state.answer = e.target.checked; render(); };
$('showGrid').onchange = e => { state.grid = e.target.checked; render(); };
$('title').addEventListener('input', e => { state.title = e.target.value; $('sheet').innerHTML = sheetSvg(current); });

/* ---------- export ---------- */
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (inFrame) { $('exportBox').hidden = true; $('frameNote').hidden = false; }
function fileBase() { return `連連看-${state.shape.name}-${current.n}點`; }
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('printBtn').onclick = () => { setMode('sheet'); window.print(); };
$('svgBtn').onclick = () => download(new Blob([sheetSvg(current)], { type: 'image/svg+xml' }), fileBase() + '.svg');
$('pngBtn').onclick = () => {
  const svg = sheetSvg(current).replace('width="210mm" height="297mm"', 'width="2480" height="3508"');
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = 2480; cv.height = 3508;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => download(b, fileBase() + '.png'), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};

/* ---------- boot ---------- */
buildLibrary();
const fromHash = SHAPES.find(s => '#' + s.id === location.hash);
if (fromHash) { state.shape = fromHash; }
state.n = state.shape.n;
render();
window.__ctd = { SHAPES, state, selectShape, render, setMode };
})();
</script>
</body>
</html>
